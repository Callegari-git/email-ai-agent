name: CI

on:
  push:
    branches: [main]
  pull_request:

# Moindre privilège : la CI lit le code, elle n'a besoin d'aucun droit d'écriture.
permissions:
  contents: read

# Un nouveau push sur une PR annule l'exécution précédente devenue obsolète.
# Sur main, chaque commit est vérifié jusqu'au bout.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Aucun secret n'est nécessaire : les tests remplacent Gmail et Gemini par des faux.
# Ne pas ajouter d'appels réels ici (coût, instabilité, exposition des identifiants).

jobs:
  quality:
    name: Lint et typage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions épinglées par SHA (un tag peut être déplacé) ; Dependabot les met à jour.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check --output-format=github .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy
        run: mypy

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # On veut voir le résultat de chaque version, même si l'une échoue.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Pytest
        run: pytest
