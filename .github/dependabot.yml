version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Mises à jour mineures et correctives regroupées dans une seule PR pour limiter
    # le bruit ; les versions majeures restent dans des PR séparées, à relire une par une.
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
